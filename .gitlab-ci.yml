# Performing tests on GitLab CI
# The virtualenv is created one level up to avoid being removed with git clean,
# it's persisted between builds for a faster run.
test:
  image: edoburu/python-runner:base
  stage: test
  script:
  - virtualenv --no-site-packages ../env
  - source ../env/bin/activate
  - pip install . coverage
  - coverage run --source=fury_registry ./runtests.py -v
  - coverage report -m
